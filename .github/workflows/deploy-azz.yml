# Build Task Foundry and publish to https://azztech.online/apps/tf/
# Uses repo secrets FTP_HOST / FTP_USER / FTP_PASS.
# Remote path is apps/tf/ under the FTP login home (/htdocs on Fasthosts).
# Trigger: push to listed paths, or Actions → Run workflow.
name: Deploy azztech.online/apps/tf

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'scripts/deploy-ftp.mjs'
      - 'scripts/build-ota.mjs'
      - 'scripts/upload-ota-ftp.mjs'
      - 'scripts/upload-api-ftp.mjs'
      - 'ota/**'
      - 'api/**'
      - 'capacitor.config.ts'
      - '.github/workflows/deploy-azz.yml'
  workflow_dispatch:

concurrency:
  # Never cancel mid-FTP: a cancelled OTA upload leaves a truncated zip that
  # latest.json still points at, and Capgo downloads then fail checksum.
  group: deploy-azztech-tf
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + FTP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build web (/apps/tf/)
        run: |
          npm run build:azz
          # Keep a copy for FTP. The OTA step rebuilds dist/ with base `/`
          # for Capacitor; publishing that would break /apps/tf/ asset URLs.
          rm -rf dist-web
          cp -a dist dist-web

      - name: Verify web dist
        run: |
          test -f dist-web/index.html
          ls -la dist-web dist-web/assets
          # Fail fast if Vite base was wrong (root-relative /assets/ → 404 on live).
          grep -q '/apps/tf/assets/' dist-web/index.html
          ! grep -qE 'src="/assets/|href="/assets/' dist-web/index.html

      - name: Build native OTA bundle
        env:
          # Monotonic semver so every deploy can update the APK without a new install.
          OTA_VERSION: 1.1.${{ github.run_number }}
        run: |
          npm run build:native
          node scripts/build-ota.mjs
          test -f ota-dist/latest.json
          test -f ota-dist/update.php
          cat ota-dist/latest.json
          # Native bundle must keep root base; web publish uses dist-web only.
          test -f dist/index.html
          grep -qE 'src="/assets/|href="/assets/' dist/index.html

      - name: Check FTP secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          missing=
          [ -n "$FTP_HOST" ] || missing="$missing FTP_HOST"
          [ -n "$FTP_USER" ] || missing="$missing FTP_USER"
          [ -n "$FTP_PASS" ] || missing="$missing FTP_PASS"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secrets:$missing"
            echo "Add FTP_HOST / FTP_USER / FTP_PASS at Settings → Secrets and variables → Actions"
            echo "Then re-run this workflow."
            exit 1
          fi
          echo "FTP secrets present"

      # Primary: SamKirkland sync (works well from GitHub-hosted runners)
      - name: FTP sync web
        id: ftp
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          port: 21
          local-dir: ./dist-web/
          server-dir: apps/tf/
          # Keep apps/tf/ota/ (APK auto-update) - clean-slate would wipe it
          dangerous-clean-slate: false
          exclude: |
            **/ota/**
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/node_modules/**/**
          timeout: 600000
          log-level: verbose

      # Fallback: reconnect-per-file uploader (handles Fasthosts 425 PASV flakes)
      - name: FTP resilient fallback
        if: steps.ftp.outcome != 'success'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE_DIR: apps/tf
          FTP_LOCAL_DIR: dist-web
          FTP_ATTEMPTS: '16'
        run: |
          npm install --no-save basic-ftp
          node scripts/deploy-ftp.mjs

      - name: FTP publish OTA (APK auto-update)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          npm install --no-save basic-ftp
          node scripts/upload-ota-ftp.mjs

      - name: FTP publish cloud save API
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          npm install --no-save basic-ftp
          node scripts/upload-api-ftp.mjs

      - name: Smoke check live site + OTA
        run: |
          set -e
          sleep 3
          code=$(curl -sS -o /tmp/tf.html -w '%{http_code}' https://azztech.online/apps/tf/)
          echo "HTTP $code"
          test "$code" = "200"
          grep -q 'Task Foundry' /tmp/tf.html
          # Must be under /apps/tf/assets/ (not /assets/) or the browser 404s.
          grep -q '/apps/tf/assets/' /tmp/tf.html
          ! grep -qE 'src="/assets/|href="/assets/' /tmp/tf.html
          # Vite may emit chunked assets (index-*.js + web-*.js); check the main bundle.
          js=$(basename dist-web/assets/index-*.js | head -n1)
          css=$(basename dist-web/assets/index-*.css | head -n1)
          echo "Expect js=$js css=$css"
          grep -q "/apps/tf/assets/$js" /tmp/tf.html
          grep -q "/apps/tf/assets/$css" /tmp/tf.html
          js_code=$(curl -sS -o /dev/null -w '%{http_code}' "https://azztech.online/apps/tf/assets/$js")
          css_code=$(curl -sS -o /dev/null -w '%{http_code}' "https://azztech.online/apps/tf/assets/$css")
          echo "js $js_code  css $css_code"
          test "$js_code" = "200"
          test "$css_code" = "200"
          api_code=$(curl -sS -o /tmp/api-session.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -d '{}' \
            https://azztech.online/apps/tf/api/session.php)
          echo "API session.php HTTP $api_code"
          echo "API body: $(head -c 200 /tmp/api-session.json)"
          health_code=$(curl -sS -o /tmp/api-health.json -w '%{http_code}' \
            https://azztech.online/apps/tf/api/health.php)
          echo "API health.php HTTP $health_code"
          test "$health_code" = "200"
          grep -q '"ok":true\|"ok": true' /tmp/api-health.json
          test "$api_code" = "400"
          grep -q 'idToken' /tmp/api-session.json
          ota_code=$(curl -sS -o /tmp/ota.json -w '%{http_code}' https://azztech.online/apps/tf/ota/latest.json)
          echo "OTA latest.json HTTP $ota_code"
          test "$ota_code" = "200"
          grep -q '"version"' /tmp/ota.json
          grep -q '"url"' /tmp/ota.json
          php_code=$(curl -sS -o /tmp/ota-php.json -w '%{http_code}' \
            -H 'Origin: https://localhost' \
            https://azztech.online/apps/tf/ota/latest.php)
          echo "OTA latest.php HTTP $php_code"
          test "$php_code" = "200"
          grep -q '"version"' /tmp/ota-php.json
          cors=$(curl -sSI -H 'Origin: https://localhost' https://azztech.online/apps/tf/ota/latest.php | tr -d '\r' | grep -i 'access-control-allow-origin' || true)
          echo "CORS: $cors"
          echo "$cors" | grep -qi 'access-control-allow-origin'
          bundle_url=$(python3 -c 'import json; print(json.load(open("/tmp/ota.json"))["url"])')
          expected_sum=$(python3 -c 'import json; print(json.load(open("/tmp/ota.json")).get("checksum") or "")')
          expected_size=$(stat -c%s ota-dist/$(basename "$bundle_url"))
          curl -sS -o /tmp/ota-bundle.zip -w "OTA bundle HTTP %{http_code} size=%{size_download}\n" "$bundle_url"
          test -s /tmp/ota-bundle.zip
          live_size=$(stat -c%s /tmp/ota-bundle.zip)
          echo "OTA bundle size live=$live_size expected=$expected_size → $bundle_url"
          test "$live_size" = "$expected_size"
          # Truncated zips often still start with PK but lack the central directory.
          python3 - <<'PY'
          import zipfile, sys
          path = "/tmp/ota-bundle.zip"
          try:
              with zipfile.ZipFile(path) as zf:
                  bad = zf.testzip()
                  names = zf.namelist()
              if bad:
                  raise SystemExit(f"corrupt member: {bad}")
              if not names:
                  raise SystemExit("zip has no entries")
              print(f"zip OK ({len(names)} entries)")
          except zipfile.BadZipFile as e:
              raise SystemExit(f"bad zip: {e}")
          PY
          if [ -n "$expected_sum" ]; then
            live_sum=$(sha256sum /tmp/ota-bundle.zip | awk '{print $1}')
            echo "OTA checksum live=$live_sum expected=$expected_sum"
            test "$live_sum" = "$expected_sum"
          fi
          echo "Live OK → https://azztech.online/apps/tf/"
          echo "OTA OK → https://azztech.online/apps/tf/ota/latest.php"
